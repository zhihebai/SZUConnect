name: Shared and macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared resources and portable core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check shared resources and public source
        run: |
          python tools/generate_shared.py --check
          python tools/check_ui_resources.py
          python tools/reference/verify_fixtures.py
          python tools/lint_windows_sources.py
          python tools/lint_swift_sources.py
          python tools/check_contrast.py
          python tools/public_scan.py
          python -m unittest discover -s tools -p 'public_*_tests.py'
      - name: Test portable connection core
        run: sh windows/SZUConnect/tests/run-core-tests.sh

  macos:
    name: macOS compile and offline contracts
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate and compile macOS application
        run: |
          python3 tools/generate_shared.py --check
          python3 macos/SZUConnect/Scripts/generate_project.py
          SZU_COMPILE_OUTPUT_DIR="$RUNNER_TEMP/mac-compile" SZU_DERIVED_DATA_DIR="$RUNNER_TEMP/mac-derived" bash macos/SZUConnect/Scripts/compile-local-mac.sh
      - name: Test shared contracts and authentication protocol offline
        run: |
          sh macos/SZUConnect/Tests/run-shared-contract.sh
          sh macos/SZUConnect/Tests/run-offline.sh
